<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCADA MASTER v3 - Login</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
  <link id="favicon" rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2210%22 width=%2280%22 height=%2260%22 rx=%225%22 fill=%22%234c1d95%22 stroke=%22%237c3aed%22 stroke-width=%225%22/><path d=%22M30 70 L20 90 L80 90 L70 70%22 fill=%22%234c1d95%22 stroke=%22%237c3aed%22 stroke-width=%225%22/></svg>">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="60" height="60" viewBox="0 0 100 100">
            <rect x="10" y="10" width="80" height="60" rx="5" fill="#4c1d95" stroke="#7c3aed" stroke-width="5"/>
            <path d="M30 70 L20 90 L80 90 L70 70" fill="#4c1d95" stroke="#7c3aed" stroke-width="5"/>
          </svg>
        </div>
        <h1>SCADA MASTER v3</h1>
        <p class="login-subtitle">Sistema de Control Industrial</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <div id="login-error" class="login-error hidden"></div>

        <button type="submit" class="btn-login">
          <span class="btn-text">INICIAR SESIÓN</span>
          <span class="btn-loader hidden">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="5"></circle>
            </svg>
          </span>
        </button>
      </form>

      <div class="login-footer">
        <p class="login-info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          Usuarios configurados en config/users.json
        </p>
        <p class="login-credentials">
          <small>Admin: admin/admin123 | Operador: operador/oper123</small>
        </p>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
